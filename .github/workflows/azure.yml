name: Windows App Service deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm prune --omit=dev
      - name: Package Windows dependencies and application
        shell: pwsh
        run: Compress-Archive -Path server.js,app.js,web.config,package.json,package-lock.json,views,static,node_modules -DestinationPath release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: release.zip
  deploy:
    needs: test
    if: vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_DEPLOY_CONFIG != ''
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
      - uses: azure/login@v2
        with:
          client-id: ${{ fromJSON(vars.AZURE_DEPLOY_CONFIG).clientId }}
          tenant-id: ${{ fromJSON(vars.AZURE_DEPLOY_CONFIG).tenantId }}
          subscription-id: ${{ fromJSON(vars.AZURE_DEPLOY_CONFIG).subscriptionId }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip
